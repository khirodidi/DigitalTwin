server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # Blueprint uploads — nginx defaults to 1 MB and returns 413 silently
    client_max_body_size 25m;
    client_body_timeout  120s;

    # ── index.html must NEVER be cached ──────────────────────────────────────
    # It references hashed bundles (main.<hash>.js). If a browser serves a
    # cached index.html after a rebuild, it requests an old hash that no longer
    # exists on disk → 404 → blank page. This is the single most common cause
    # of "blank page after redeploy".
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma        "no-cache" always;
        expires    -1;
        try_files  $uri =404;
    }

    # ── Hashed build assets are immutable — safe to cache forever ────────────
    location /static/js/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /static/css/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /static/media/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── Uploaded blueprints come from the backend, not the build ─────────────
    location /static/blueprints/ {
        proxy_pass http://backend:8000/static/blueprints/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 25m;
    }

    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # ── SPA fallback — must come last ────────────────────────────────────────
    # A missing bundle returns 404 rather than silently serving index.html,
    # which would otherwise mask the real problem.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
