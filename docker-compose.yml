version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dt_postgres
    environment:
      POSTGRES_DB:       digital_twin
      POSTGRES_USER:     dt_user
      POSTGRES_PASSWORD: dt_pass
    volumes:
      # Named volume — managed by Docker (bind mount rolled back)
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dt_user -d digital_twin"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── MQTT broker ─────────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: dt_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    restart: unless-stopped

  # ── Backend: FastAPI + Digital Twin Engine + AI ─────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dt_backend
    environment:
      POSTGRES_DSN:       postgresql://dt_user:dt_pass@postgres:5432/digital_twin
      MQTT_HOST:          mosquitto
      MQTT_PORT:          "1883"
      HEARTBEAT_INTERVAL: "5"
      DEGRADED_THRESHOLD: "2"
      OFFLINE_THRESHOLD:  "5"
      TEMP_CRITICAL:      "60.0"
      TEMP_WARNING:       "50.0"
      HUMIDITY_CRITICAL:  "85.0"
      HUMIDITY_WARNING:   "70.0"
    volumes:
      - model_store:/app/models
      - blueprint_store:/app/static/blueprints
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

  # ── Frontend: React build served by Nginx ───────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Only connection settings live here.
        # Factory name, grid size and blueprint are configured at runtime in
        # the Configuration page and stored in PostgreSQL.
        REACT_APP_API_URL: "http://localhost:8000"
        REACT_APP_WS_URL:  "ws://localhost:8000/ws"
    container_name: dt_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── WSN simulator (optional: docker compose --profile sim up) ───────────────
  simulator:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dt_simulator
    command: >
      python scripts/simulate_wsn.py
      --api http://backend:8000
      --host mosquitto --port 1883
      --interval 2
      --violation-rate 0.03
      --fire-delay 300
    depends_on:
      - mosquitto
      - backend
    restart: unless-stopped
    profiles:
      - sim

volumes:
  postgres_data:
  blueprint_store:
  mosquitto_data:
  mosquitto_logs:
  model_store:
